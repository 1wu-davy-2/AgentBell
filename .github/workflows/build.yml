name: Build AgentBell

on:
  push:
    branches: [main, master, develop, develop-integrations]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  test-linux:
    name: Tests (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            libfontconfig1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q --tb=short 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Pytest failure (Linux ${{ matrix.arch }})"
              echo '```'
              tail -n 150 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

  build:
    name: Package AgentBell.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve latest spec and output name
        shell: pwsh
        run: |
          $spec = Get-ChildItem -Path . -Filter "AgentBell*.spec" |
            Where-Object { $_.BaseName -match '^AgentBell\d+$' } |
            Sort-Object { [int]($_.BaseName -replace '\D', '') } |
            Select-Object -Last 1
          if (-not $spec) { throw "No AgentBell<N>.spec found" }
          $versioned = "dist/" + ($spec.BaseName -replace '^AgentBell', 'AgentBell-') + ".exe"
          "SPEC_FILE=$($spec.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSIONED_EXE=$versioned" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($spec.Name) -> $versioned"
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm $env:SPEC_FILE
      - name: Add stable update asset name
        shell: pwsh
        run: |
          Copy-Item $env:VERSIONED_EXE dist/AgentBell.exe -Force
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist/SHA256SUMS.txt
          }
          Get-Content dist/SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-windows
          path: |
            dist/AgentBell.exe
            dist/AgentBell-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Package AgentBell (Linux ${{ matrix.arch }})
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            libfontconfig1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm AgentBell-linux.spec
      - name: Package tar.gz
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/AgentBell-linux-${{ matrix.arch }}.tar.gz" AgentBell
          cd dist
          sha256sum "AgentBell-linux-${{ matrix.arch }}.tar.gz" \
            > "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-linux-${{ matrix.arch }}.txt"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-linux-${{ matrix.arch }}
          path: |
            dist/AgentBell-linux-${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches __version__
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $match = Select-String -Path agentbell/__init__.py -Pattern '__version__ = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "Tag $tag does not match __version__ $version"
          }
      - uses: actions/download-artifact@v4
        with:
          name: AgentBell-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AgentBell-linux-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: AgentBell-linux-arm64
          path: release
      - name: Combine checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter "SHA256SUMS*.txt"
          $lines = $files | ForEach-Object { Get-Content $_.FullName } |
            Where-Object { $_ -match '\S' } |
            Sort-Object -Unique
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release/SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            [Text.Encoding]::ASCII
          )
          Get-Content release/SHA256SUMS.txt
      - name: Publish release with curated notes
        if: hashFiles(format('docs/releases/{0}.md', github.ref_name)) != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentBell.exe
            release/AgentBell-*.exe
            release/AgentBell-linux-x64.tar.gz
            release/AgentBell-linux-arm64.tar.gz
            release/SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
      - name: Publish release
        if: hashFiles(format('docs/releases/{0}.md', github.ref_name)) == ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentBell.exe
            release/AgentBell-*.exe
            release/AgentBell-linux-x64.tar.gz
            release/AgentBell-linux-arm64.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
