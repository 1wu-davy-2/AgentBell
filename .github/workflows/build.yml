name: Build AgentBell

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  build:
    name: Package AgentBell.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm AgentBell12.spec
      - name: Add stable update asset name
        shell: pwsh
        run: |
          Copy-Item dist/AgentBell-12.exe dist/AgentBell.exe -Force
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii dist/SHA256SUMS.txt
          }
          Get-Content dist/SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-windows
          path: |
            dist/AgentBell.exe
            dist/AgentBell-12.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches __version__
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $match = Select-String -Path agentbell/__init__.py -Pattern '__version__ = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "Tag $tag does not match __version__ $version"
          }
      - uses: actions/download-artifact@v4
        with:
          name: AgentBell-windows
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentBell.exe
            release/AgentBell-12.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
