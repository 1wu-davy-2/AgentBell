name: Build AgentBell

on:
  push:
    branches: [main, master, develop, develop-integrations]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test-windows:
    name: Tests (Windows ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            python_arch: x64
          - runner: windows-11-arm
            arch: arm64
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q --tb=short --junitxml=pytest.xml
      - name: Report test failures
        if: failure()
        run: python scripts/ci_pytest_report.py pytest.xml

  test-linux:
    name: Tests (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            libfontconfig1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q --tb=short --junitxml=pytest.xml 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Pytest failure (Linux ${{ matrix.arch }})"
              echo '```'
              tail -n 150 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Report test failures
        if: failure()
        run: python scripts/ci_pytest_report.py pytest.xml

  test-macos:
    name: Tests (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests -q --tb=short --junitxml=pytest.xml 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Pytest failure (macOS ${{ matrix.arch }})"
              echo '```'
              tail -n 150 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Report test failures
        if: failure()
        run: python scripts/ci_pytest_report.py pytest.xml

  build-windows:
    name: Package AgentBell.exe (${{ matrix.arch }})
    needs: test-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Resolve latest spec and output name
        shell: pwsh
        run: |
          $spec = Get-ChildItem -Path . -Filter "AgentBell*.spec" |
            Where-Object { $_.BaseName -match '^AgentBell\d+$' } |
            Sort-Object { [int]($_.BaseName -replace '\D', '') } |
            Select-Object -Last 1
          if (-not $spec) { throw "No AgentBell<N>.spec found" }
          $number = $spec.BaseName -replace '^AgentBell', ''
          "SPEC_FILE=$($spec.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SPEC_NUMBER=$number" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($spec.Name) -> AgentBell-$number.exe"
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm $env:SPEC_FILE
      - name: Check signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            "SIGNING_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "::warning::WINDOWS_CERT_PFX_BASE64 未配置，将产出未签名构建"
          }
      - name: Sign AgentBell.exe
        if: env.SIGNING_ENABLED == '1'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          python scripts/sign_windows.py --target "dist/AgentBell-$env:SPEC_NUMBER.exe"
      - name: Name architecture assets and checksum
        shell: pwsh
        run: |
          $built = "dist/AgentBell-$env:SPEC_NUMBER.exe"
          if (-not (Test-Path $built)) { throw "Missing $built" }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $versioned = "dist/AgentBell-$env:SPEC_NUMBER-arm64.exe"
            Move-Item -LiteralPath $built -Destination $versioned -Force
            Copy-Item $versioned dist/AgentBell-arm64.exe -Force
          } else {
            Copy-Item $built dist/AgentBell.exe -Force
          }
          $lines = Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          Set-Content -Path "dist/SHA256SUMS-windows-${{ matrix.arch }}.txt" -Value $lines -Encoding ascii
          Get-Content "dist/SHA256SUMS-windows-${{ matrix.arch }}.txt"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-windows-${{ matrix.arch }}
          path: |
            dist/AgentBell*.exe
            dist/SHA256SUMS-windows-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Package AgentBell (Linux ${{ matrix.arch }})
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            libfontconfig1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm AgentBell-linux.spec
      - name: Install packaging tools
        run: sudo apt-get install -y rpm
      - name: Download pinned AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)
              tool=appimagetool-x86_64.AppImage
              tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime=runtime-x86_64
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
              ;;
            arm64)
              tool=appimagetool-aarch64.AppImage
              tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime=runtime-aarch64
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
              ;;
          esac
          curl -fsSL --retry 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/$tool"
          echo "$tool_sha  appimagetool" | sha256sum -c -
          curl -fsSL --retry 3 -o appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/$runtime"
          echo "$runtime_sha  appimage-runtime" | sha256sum -c -
          chmod +x appimagetool
      - name: Build Linux packages
        run: |
          VERSION=$(python -c "from agentbell import __version__; print(__version__)")
          python scripts/build_linux_packages.py \
            --binary dist/AgentBell \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            --outdir dist \
            --appimagetool ./appimagetool \
            --appimage-runtime ./appimage-runtime
          ls -lh dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-linux-${{ matrix.arch }}
          path: |
            dist/AgentBell-linux-${{ matrix.arch }}.tar.gz
            dist/AgentBell-linux-${{ matrix.arch }}.AppImage
            dist/AgentBell-linux-${{ matrix.arch }}.deb
            dist/AgentBell-linux-${{ matrix.arch }}.rpm
            dist/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Package AgentBell.app (macOS ${{ matrix.arch }})
    needs: test-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate .icns icon
        run: python scripts/make_macos_icon.py
      - name: Build .app bundle
        run: python -m PyInstaller --noconfirm AgentBell-macos.spec
      - name: Check signing credentials
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            echo "MACOS_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::MACOS_CERT_P12_BASE64 未配置，将使用 ad-hoc 签名"
          fi
          if [ -n "$MACOS_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_BASE64" ] \
            && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "MACOS_NOTARIZE=1" >> "$GITHUB_ENV"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D \
              > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          else
            echo "::warning::Apple 公证凭据不完整，跳过公证"
          fi
      - name: Import Developer ID certificate
        if: env.MACOS_SIGNING_ENABLED == '1'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/agentbell-signing.keychain-db"
          keychain_password="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -D \
            > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::导入的证书中没有 Developer ID Application 身份"
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package dmg and zip
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "from agentbell import __version__; print(__version__)")
          args=(
            --app dist/AgentBell.app
            --version "$VERSION"
            --arch "${{ matrix.arch }}"
            --outdir dist
            --entitlements assets/macos_entitlements.plist
          )
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            args+=(--identity "$MACOS_SIGN_IDENTITY")
          fi
          if [ "${MACOS_NOTARIZE:-0}" = "1" ]; then
            args+=(
              --notarize
              --notary-key "$RUNNER_TEMP/AuthKey.p8"
              --notary-key-id "$APPLE_API_KEY_ID"
              --notary-issuer "$APPLE_API_ISSUER"
            )
          fi
          python scripts/build_macos_packages.py "${args[@]}"
          ls -lh dist
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/agentbell-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBell-macos-${{ matrix.arch }}
          path: |
            dist/AgentBell-macos-${{ matrix.arch }}.dmg
            dist/AgentBell-macos-${{ matrix.arch }}.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches __version__
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $match = Select-String -Path agentbell/__init__.py -Pattern '__version__ = "([^"]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "Tag $tag does not match __version__ $version"
          }
      - uses: actions/download-artifact@v4
        with:
          pattern: AgentBell-*
          path: release
          merge-multiple: true
      - name: Combine checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter "SHA256SUMS*.txt"
          $lines = $files | ForEach-Object { Get-Content $_.FullName } |
            Where-Object { $_ -match '\S' } |
            Sort-Object -Unique
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'release/SHA256SUMS.txt'),
            (($lines -join "`n") + "`n"),
            [Text.Encoding]::ASCII
          )
          Get-Content release/SHA256SUMS.txt
      - name: Publish release with curated notes
        if: hashFiles(format('docs/releases/{0}.md', github.ref_name)) != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentBell.exe
            release/AgentBell-*.exe
            release/AgentBell-macos-x64.dmg
            release/AgentBell-macos-arm64.dmg
            release/AgentBell-macos-x64.zip
            release/AgentBell-macos-arm64.zip
            release/AgentBell-linux-x64.tar.gz
            release/AgentBell-linux-arm64.tar.gz
            release/AgentBell-linux-x64.AppImage
            release/AgentBell-linux-arm64.AppImage
            release/AgentBell-linux-x64.deb
            release/AgentBell-linux-arm64.deb
            release/AgentBell-linux-x64.rpm
            release/AgentBell-linux-arm64.rpm
            release/SHA256SUMS.txt
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
      - name: Publish release
        if: hashFiles(format('docs/releases/{0}.md', github.ref_name)) == ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AgentBell.exe
            release/AgentBell-*.exe
            release/AgentBell-macos-x64.dmg
            release/AgentBell-macos-arm64.dmg
            release/AgentBell-macos-x64.zip
            release/AgentBell-macos-arm64.zip
            release/AgentBell-linux-x64.tar.gz
            release/AgentBell-linux-arm64.tar.gz
            release/AgentBell-linux-x64.AppImage
            release/AgentBell-linux-arm64.AppImage
            release/AgentBell-linux-x64.deb
            release/AgentBell-linux-arm64.deb
            release/AgentBell-linux-x64.rpm
            release/AgentBell-linux-arm64.rpm
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
